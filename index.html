  {

    recycling: "WRITE: how it is recycled and what it can become",
    swapIdea: "WRITE: We are replacing [old material] because it is [failing indicator]. Our idea: [advanced material].",

    swapTradeOff: "WRITE: what gets worse or is still a problem",
    swapCircularWin: "WRITE: how it helps at end of life, or say if it does not"
  }
];

/* Klasa u Teachable Machineu za sliku bez predmeta (prazna pozadina).
   Ako je imate pod drugim nazivom, ovdje upisite taj naziv.                */

</script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

<style>
  :root {
    --bg: #eefbf5; --card: rgba(255, 255, 255, .86); --ink: #10291f; --muted: #47665a;
    --brand: #0b7a52; --glow: #18d98f; --line: rgba(11, 122, 82, .28); --on-brand: #ffffff;
    --blue: #1f63c4; --yellow: #9a7400; --green: #16824a; --brown: #7a4a21; --grey: #46555a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--ink);
         background-color: var(--bg);
         background-image:
           radial-gradient(circle at 15% 0%, rgba(24, 217, 143, .28), transparent 42%),
           radial-gradient(circle at 100% 30%, rgba(0, 174, 190, .18), transparent 38%),
           linear-gradient(rgba(11, 122, 82, .07) 1px, transparent 1px),
           linear-gradient(90deg, rgba(11, 122, 82, .07) 1px, transparent 1px);
         background-size: auto, auto, 28px 28px, 28px 28px;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; letter-spacing: .03em; margin: 4px 0 14px; color: var(--brand);
       text-shadow: 0 0 14px rgba(24, 217, 143, .35); }
  h1::before { content: "\2726  "; }
  .camera { position: relative; aspect-ratio: 1; background: #000; border-radius: 22px; overflow: hidden;
            border: 1px solid var(--line); box-shadow: 0 0 24px rgba(24, 217, 143, .3); }
  video, #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #photo { display: none; }
  .camera::before { content: ""; position: absolute; inset: 14px; z-index: 2; pointer-events: none;
    --c: var(--glow); --l: 34px; --w: 3px;
    background:
      linear-gradient(var(--c) 0 0) top left / var(--l) var(--w),
      linear-gradient(var(--c) 0 0) top left / var(--w) var(--l),
      linear-gradient(var(--c) 0 0) top right / var(--l) var(--w),
      linear-gradient(var(--c) 0 0) top right / var(--w) var(--l),
      linear-gradient(var(--c) 0 0) bottom left / var(--l) var(--w),
      linear-gradient(var(--c) 0 0) bottom left / var(--w) var(--l),
      linear-gradient(var(--c) 0 0) bottom right / var(--l) var(--w),
      linear-gradient(var(--c) 0 0) bottom right / var(--w) var(--l);
    background-repeat: no-repeat; }
  .camera::after { content: ""; position: absolute; left: 14px; right: 14px; top: 18%; height: 2px; z-index: 2;
    pointer-events: none; background: var(--glow); box-shadow: 0 0 14px 3px rgba(24, 217, 143, .7);
    animation: sweep 3.2s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 8%; } to { top: 92%; } }
  @media (prefers-reduced-motion: reduce) { .camera::after { animation: none; top: 50%; } }
  button, .file { display: block; width: 100%; padding: 14px; margin-top: 10px; border-radius: 999px;
                  font: inherit; font-weight: 700; text-align: center; cursor: pointer; }
  button { background: var(--brand); color: var(--on-brand); border: 0; box-shadow: 0 6px 18px rgba(11, 122, 82, .3); }
  button:disabled { opacity: .45; box-shadow: none; }
  .file { background: rgba(255, 255, 255, .7); color: var(--ink); border: 1px solid var(--line); }
  .file input { display: none; }
  #status { margin: 12px 0 0; color: var(--muted); }
  #status.error { color: #b3261e; font-weight: 600; }
  #result { display: none; margin-top: 14px; background: var(--card); border: 1px solid var(--line);
            border-radius: 22px; overflow: hidden; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #bin { padding: 15px 18px; color: #fff; font-weight: 700; font-size: 1.1rem; }
  #bin small { display: block; font-weight: 500; font-size: .85rem; opacity: .92; }
  .body { padding: 6px 18px 16px; }
  h2 { font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); margin: 14px 0 3px; }
  p { margin: 0; }
</style>

<body>
<main>
  <h1>Product Scanner</h1>
  <div class="camera">
    <video id="video" playsinline muted autoplay></video>
    <img id="photo" alt="Selected item">
  </div>
  <button id="scan" disabled>Scan item</button>
  <label class="file">Choose a photo
    <input id="file" type="file" accept="image/*">
  </label>
  <p id="status" role="status">Loading the model…</p>

  <section id="result" aria-live="polite">
    <div id="bin"></div>
    <div class="body">
      <h2>What is it made of?</h2><p id="madeOf"></p>
      <h2>How do I prepare it?</h2><p id="prepare"></p>
      <h2>How is it recycled?</h2><p id="recycling"></p>
      <h2>Material swap idea</h2><p id="swapIdea"></p>
      <h2>The gain</h2><p id="swapGain"></p>
      <h2>The trade-off</h2><p id="swapTradeOff"></p>
      <h2>The circular win</h2><p id="swapCircularWin"></p>
    </div>
  </section>
</main>

<script>
  const MIN_CONFIDENCE = 0.6;
  const RECYCLABLE_TEXT = { YES: "Yes", PARTLY: "Partly", NO: "No" };
  const $ = (id) => document.getElementById(id);
  const clean = (s) => String(s).trim().toLowerCase();
  let model = null;

  function setStatus(text, isError) {
    $("status").textContent = text;
    $("status").className = isError ? "error" : "";
  }

  function findMaterial(label) {
    return MATERIALS.find((m) => clean(m.class) === clean(label));
  }

  // Warn about class names that do not match the student block.
  function checkClasses(labels) {
    const missing = labels.filter((l) => clean(l) !== clean(EMPTY_CLASS) && !findMaterial(l));
    if (missing.length) {
      setStatus("Ime klase nije u tablici: " + missing.join(", ") +
                ". Provjerite retke \"class\" u kodu.", true);
    } else {
      setStatus("Ready. Point the camera at an item and tap Scan.");
    }
  }

  async function loadModel() {
    if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[^/]+\/?$/.test(MODEL_LINK.trim())) {
      setStatus("U KORAKU 1 zalijepite poveznicu na svoj Teachable Machine model.", true);
      return;
    }
    const base = MODEL_LINK.trim().replace(/\/?$/, "/");
    try {
      model = await tmImage.load(base + "model.json", base + "metadata.json");
      $("scan").disabled = false;
      checkClasses(model.getClassLabels());
    } catch (e) {
      setStatus("Model se nije ucitao. Provjerite poveznicu i internetsku vezu.", true);
    }
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }, audio: false
      });
      $("video").srcObject = stream;
    } catch (e) {
      $("video").style.display = "none";
      $("scan").style.display = "none";
      if (!$("status").classList.contains("error")) {
        setStatus("Camera is not available. Use Choose a photo.");
      }
    }
  }

  // Take the centre square of the picture, as Teachable Machine models expect.
  function toSquare(source, width, height) {
    const size = Math.min(width, height);
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 224;
    canvas.getContext("2d").drawImage(
      source, (width - size) / 2, (height - size) / 2, size, size, 0, 0, 224, 224
    );
    return canvas;
  }

  function showResult(best) {
    const box = $("result");
    box.style.display = "none";
    if (clean(best.className) === clean(EMPTY_CLASS)) {
      setStatus("No item found. Try again.");
      return;
    }
    if (best.probability < MIN_CONFIDENCE) {
      setStatus("Not sure what this is. Try a closer photo with a plain background.");
      return;
    }
    const m = findMaterial(best.className);
    if (!m) {
      setStatus("Ime klase \"" + best.className + "\" nije u tablici u kodu.", true);
      return;
    }
    const bin = $("bin");
    bin.textContent = m.container;
    const small = document.createElement("small");
    small.textContent = m.class + " · " + Math.round(best.probability * 100) + "% confidence · Recyclable: " +
      (RECYCLABLE_TEXT[m.recyclable] || m.recyclable);
    bin.appendChild(small);
    bin.style.background = "var(--" + m.color + ", var(--grey))";
    ["madeOf", "prepare", "recycling", "swapIdea", "swapGain", "swapTradeOff", "swapCircularWin"]
      .forEach((field) => { $(field).textContent = m[field]; });
    box.style.display = "block";
    setStatus("Done. Scan another item whenever you are ready.");
  }

  async function classify(canvas) {
    if (!model) return;
    const predictions = await model.predict(canvas);
    predictions.sort((a, b) => b.probability - a.probability);
    showResult(predictions[0]);
  }

  $("scan").addEventListener("click", () => {
    const v = $("video");
    if (!v.videoWidth) { setStatus("Camera is still starting. Try again."); return; }
    $("photo").style.display = "none";
    classify(toSquare(v, v.videoWidth, v.videoHeight));
  });

  $("file").addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const img = $("photo");
    img.onload = () => {
      img.style.display = "block";
      classify(toSquare(img, img.naturalWidth, img.naturalHeight));
    };
    img.src = URL.createObjectURL(file);
  });

  loadModel();
  startCamera();
</script>
</body>
</html>
